<svg xmlns="http://www.w3.org/2000/svg" width="900" height="316" viewBox="0 0 900 316" font-family="&#x27;MesloLGS Nerd Font Mono&#x27;,&#x27;JetBrainsMono NF&#x27;,&#x27;JetBrainsMono Nerd Font Mono&#x27;,&#x27;JetBrainsMonoNL Nerd Font Mono&#x27;,&#x27;FiraCode Nerd Font Mono&#x27;,&#x27;FiraCode Nerd Font&#x27;,ui-monospace,&#x27;SF Mono&#x27;,Menlo,&#x27;Cascadia Mono&#x27;,Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Liberation Mono&#x27;,monospace"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#C800DF"/><stop offset="1" stop-color="#E60076"/></linearGradient></defs><rect x="1" y="1" width="898" height="314" rx="14" fill="#0C0C0F" stroke="#2A2A33" stroke-width="2"/><rect x="1" y="1" width="898" height="4" rx="2" fill="url(#g)"/><text x="28" y="40" font-size="15" font-weight="700" fill="#C800DF" text-anchor="start">$ </text><text x="46" y="40" font-size="15" font-weight="700" fill="#F3F4F6" text-anchor="start">cat about.md</text><text x="28" y="78" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">A decade leading teams through high-stress, high-stakes moments, where lives</text><text x="28" y="100" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">and billions of dollars were on the line. Staying calm is a skill; I practice it.</text><text x="28" y="144" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">I&#x27;ve built three SRE programs from the ground up: Honda Aircraft, Duke Energy,</text><text x="28" y="166" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">and a hedge fund. The playbook never changed. Automate the toil, fix the process,</text><text x="28" y="188" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">and run blameless post-mortems until &quot;I don&#x27;t know&quot; and &quot;that was me&quot; are the</text><text x="28" y="210" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">safest things an engineer can say.</text><text x="28" y="254" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">20+ years hands-on with AWS, GCP, Kubernetes and Terraform. K.I.S.S.</text><svg x="28" y="273" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></g></svg><text x="52" y="286" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">Charlotte, NC · remote</text><svg x="253.6" y="273" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4-4h4m0 13v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></g></svg><text x="277.6" y="286" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">secunit, llc</text><svg x="401.2" y="273" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12l2 2l4-4"/></g></svg><text x="425.2" y="286" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">CISSP since 2017</text><svg x="580.0" y="273" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20a14.5 14.5 0 0 0 0-20M2 12h20"/></g></svg><text x="604.0" y="286" font-size="13" font-weight="400" fill="#9C